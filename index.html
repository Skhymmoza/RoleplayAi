<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RoleplayAI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0c0c0e;
  --s1: #131315;
  --s2: #1b1b1f;
  --s3: #222228;
  --b1: #272730;
  --b2: #35353f;
  --ac: #d4b896;
  --ac2: #b8956a;
  --tx: #e2e2de;
  --tx2: #a0a09a;
  --mu: #58585e;
  --red: #b05040;
  --green: #6ab87a;
  --pink: #f4a7c0;
  --pinkbg: rgba(244,167,192,0.10);
  --blue: #8ec8f0;
  --bluebg: rgba(142,200,240,0.10);
}

html { height: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--tx); font-family: 'DM Sans', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; }

/* ── TOP BAR ── */
#topbar {
  display: flex;
  align-items: center;
  height: 52px;
  min-height: 52px;
  padding: 0 12px;
  background: var(--s1);
  border-bottom: 1px solid var(--b1);
  gap: 8px;
  flex-shrink: 0;
  z-index: 10;
}

.tb-logo {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--ac);
  text-transform: uppercase;
  flex: 1;
}

.tb-btn {
  background: var(--s2);
  border: 1px solid var(--b2);
  border-radius: 8px;
  color: var(--tx2);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  padding: 0 14px;
  height: 36px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.tb-btn:hover { border-color: var(--ac2); color: var(--ac); }
.tb-btn.gold { background: var(--ac2); border-color: var(--ac2); color: #0c0c0e; font-weight: 500; }
.tb-btn.gold:hover { background: var(--ac); border-color: var(--ac); }
.tb-btn.has-key { border-color: var(--green); color: var(--green); }
.tb-btn.has-key:hover { background: rgba(106,184,122,0.1); }

/* ── BODY ── */
#body { flex: 1; display: flex; overflow: hidden; }

/* ── PANEL OVERLAY ── */
#panelOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; }
#panelOverlay.show { display: block; }

#panel {
  position: fixed;
  top: 52px; left: 0; bottom: 0;
  width: min(280px, 80vw);
  background: var(--s1);
  border-right: 1px solid var(--b1);
  z-index: 60;
  display: flex;
  flex-direction: column;
  transform: translateX(-110%);
  transition: transform 0.26s cubic-bezier(.3,0,.2,1);
}
#panel.show { transform: translateX(0); }

.panel-head {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.panel-title { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--mu); text-transform: uppercase; }
.panel-close { background: none; border: none; color: var(--mu); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 3px; }
.panel-close:hover { color: var(--tx); }

#charList { flex: 1; overflow-y: auto; padding: 6px 8px; }
#charList::-webkit-scrollbar { width: 3px; }
#charList::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

.char-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: 9px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 2px;
  transition: background 0.12s;
}
.char-item:hover { background: var(--s2); }
.char-item.active { background: var(--s2); border-color: var(--b2); }
.char-av {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--s3); border: 1px solid var(--b2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; overflow: hidden;
}
.char-av img { width: 100%; height: 100%; object-fit: cover; }
.char-info { flex: 1; min-width: 0; overflow: hidden; }
.char-name { font-size: 14px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-sub { font-size: 11px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.char-del { opacity: 0; background: none; border: none; color: var(--mu); cursor: pointer; font-size: 14px; padding: 3px 6px; transition: all 0.12s; flex-shrink: 0; }
.char-item:hover .char-del { opacity: 1; }
.char-del:hover { color: var(--red); }

.panel-add {
  margin: 8px; padding: 11px;
  background: none; border: 1px dashed var(--b2); border-radius: 9px;
  color: var(--mu); font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 0.07em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s; flex-shrink: 0;
}
.panel-add:hover { border-color: var(--ac2); color: var(--ac); }

/* ── CHAT AREA ── */
#chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

#emptyState {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--mu); text-align: center; padding: 32px;
}
.empty-icon { font-size: 36px; opacity: 0.28; }
.empty-t { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.empty-s { font-size: 13px; }

/* api key warning in empty state */
.empty-warn {
  margin-top: 8px; padding: 10px 16px;
  background: rgba(176,80,64,0.12); border: 1px solid rgba(176,80,64,0.25);
  border-radius: 10px; font-size: 12px; color: #d07060;
  font-family: 'DM Mono', monospace; letter-spacing: 0.04em;
  cursor: pointer; transition: all 0.15s;
}
.empty-warn:hover { background: rgba(176,80,64,0.2); }

#chatWrap { flex: 1; display: none; flex-direction: column; overflow: hidden; }
#chatWrap.show { display: flex; }

/* chat header */
#chatHeader {
  padding: 10px 14px;
  border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
#hAvatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--s3); border: 1px solid var(--b2);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; overflow: hidden;
}
#hAvatar img { width: 100%; height: 100%; object-fit: cover; }
#hInfo { flex: 1; min-width: 0; overflow: hidden; }
#hName { font-size: 14px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hRole { font-size: 11px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hActions { display: flex; gap: 6px; flex-shrink: 0; }

.hbtn {
  background: none; border: 1px solid var(--b1); border-radius: 7px;
  color: var(--tx2); cursor: pointer; height: 32px; padding: 0 10px;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em;
  transition: all 0.12s; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.hbtn:hover { border-color: var(--b2); color: var(--tx); }
.hbtn.d:hover { border-color: var(--red); color: var(--red); }
.hbtn-label { display: inline; }

/* legend */
#legend {
  display: flex; gap: 14px;
  padding: 5px 14px 0; flex-shrink: 0;
}
.leg { display: flex; align-items: center; gap: 5px; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.06em; color: var(--mu); }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.leg-dot.p { background: var(--pink); }
.leg-dot.b { background: var(--blue); }

/* messages */
#messages {
  flex: 1; overflow-y: auto;
  padding: 14px; display: flex; flex-direction: column; gap: 12px;
  overscroll-behavior: contain;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

.msg { display: flex; gap: 9px; max-width: 82%; animation: fu .2s ease; }
@keyframes fu { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.msg.u { align-self: flex-end; flex-direction: row-reverse; }

.m-av {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--s3); border: 1px solid var(--b2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; margin-top: 2px; overflow: hidden;
}
.m-av img { width: 100%; height: 100%; object-fit: cover; }

.m-bub { padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.7; max-width: 100%; word-break: break-word; position: relative; }
.msg.ai .m-bub { background: var(--s2); border: 1px solid var(--b1); border-radius: 4px 12px 12px 12px; }
.msg.u .m-bub { background: var(--s3); border: 1px solid var(--b2); border-radius: 12px 4px 12px 12px; }
.m-name { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.1em; color: var(--mu); margin-bottom: 5px; text-transform: uppercase; }

/* msg actions on hover */
.msg-actions {
  display: none; position: absolute; bottom: -24px; right: 0;
  background: var(--s3); border: 1px solid var(--b2);
  border-radius: 7px; padding: 2px 4px;
  gap: 2px; z-index: 5;
}
.msg:hover .msg-actions { display: flex; }
.msg-act-btn {
  background: none; border: none; cursor: pointer;
  color: var(--mu); font-size: 11px; padding: 3px 6px;
  border-radius: 5px; font-family: 'DM Mono', monospace;
  letter-spacing: 0.03em; transition: all 0.1s;
}
.msg-act-btn:hover { color: var(--tx); background: var(--b1); }

.sa { color: var(--pink); background: var(--pinkbg); border-radius: 3px; padding: 0 3px; font-style: italic; }
.sf { color: var(--blue); background: var(--bluebg); border-radius: 3px; padding: 0 3px; font-style: italic; }

.typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.td { width: 5px; height: 5px; border-radius: 50%; background: var(--mu); animation: tb 1.2s infinite; }
.td:nth-child(2){animation-delay:.2s} .td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* input */
#inputArea { padding: 10px 12px; border-top: 1px solid var(--b1); flex-shrink: 0; }
#inputRow { display: flex; gap: 8px; align-items: flex-end; }
#msgIn {
  flex: 1; background: var(--s2); border: 1px solid var(--b1);
  border-radius: 11px; color: var(--tx);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 300;
  padding: 10px 13px; resize: none; outline: none; line-height: 1.5;
  min-height: 46px; max-height: 130px;
  transition: border-color 0.15s; -webkit-appearance: none;
}
#msgIn:focus { border-color: var(--b2); }
#msgIn::placeholder { color: var(--mu); }

.input-btns { display: flex; gap: 6px; align-items: flex-end; flex-shrink: 0; }

#regenBtn {
  background: none; border: 1px solid var(--b1); border-radius: 11px;
  color: var(--mu); cursor: pointer; width: 46px; height: 46px; font-size: 16px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
#regenBtn:hover { border-color: var(--b2); color: var(--ac); }
#regenBtn:disabled { opacity: 0.3; cursor: not-allowed; }

#sendBtn {
  background: var(--ac2); border: none; border-radius: 11px;
  color: var(--bg); cursor: pointer; width: 46px; height: 46px; font-size: 19px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
#sendBtn:hover { background: var(--ac); }
#sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

#inputMeta { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px 0; }
#memBadge { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--mu); letter-spacing: 0.05em; }
#charCount { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--mu); letter-spacing: 0.05em; }

/* ── MODAL (shared base) ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 200;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-bg.show { display: flex; }
.modal-bg.center { align-items: center; }

.modal-sheet {
  background: var(--s1); border: 1px solid var(--b2);
  border-radius: 18px 18px 0 0;
  width: 100%; max-width: 560px; max-height: 92vh;
  overflow-y: auto; animation: mup .22s ease;
}
.modal-sheet.small { max-width: 420px; border-radius: 16px; }
@keyframes mup { from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1} }
.modal-sheet::-webkit-scrollbar { width: 3px; }
.modal-sheet::-webkit-scrollbar-thumb { background: var(--b2); }

.m-handle { width: 36px; height: 4px; background: var(--b2); border-radius: 2px; margin: 10px auto 0; }
.m-head { padding: 13px 18px 11px; border-bottom: 1px solid var(--b1); display: flex; align-items: center; justify-content: space-between; }
.m-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.13em; color: var(--ac); text-transform: uppercase; }
.m-close { background: none; border: none; color: var(--mu); cursor: pointer; font-size: 22px; line-height: 1; padding: 0 3px; }
.m-close:hover { color: var(--tx); }
.m-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: var(--mu); text-transform: uppercase; }
.field input, .field textarea, .field select {
  background: var(--s2); border: 1px solid var(--b1); border-radius: 9px;
  color: var(--tx); font-family: 'DM Sans', sans-serif; font-size: 15px;
  font-weight: 300; padding: 10px 13px; outline: none; width: 100%;
  transition: border-color 0.12s; -webkit-appearance: none; appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--b2); }
.field textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
.field select { cursor: pointer; }
.field select option { background: var(--s2); }
.field input::placeholder, .field textarea::placeholder { color: var(--mu); }

/* password field with toggle */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px; }
.pw-eye {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--mu); cursor: pointer;
  font-size: 15px; padding: 0; transition: color 0.12s;
}
.pw-eye:hover { color: var(--tx); }

/* range slider */
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 3px; background: var(--b2); border-radius: 2px;
  outline: none; border: none; padding: 0;
}
.range-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: var(--ac2); border-radius: 50%; cursor: pointer;
  transition: background 0.12s;
}
.range-row input[type=range]::-webkit-slider-thumb:hover { background: var(--ac); }
.range-val {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--ac); min-width: 30px; text-align: right;
}

/* key status indicator */
.key-status {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 13px; border-radius: 9px;
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.07em;
  border: 1px solid var(--b1); background: var(--s2);
}
.key-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.key-dot.ok { background: var(--green); box-shadow: 0 0 5px var(--green); }
.key-dot.no { background: var(--red); }

/* settings section label */
.settings-section {
  font-family: 'DM Mono', monospace; font-size: 8px;
  letter-spacing: 0.14em; color: var(--mu); text-transform: uppercase;
  padding-bottom: 6px; border-bottom: 1px solid var(--b1);
  margin-bottom: 2px;
}

.av-row { display: flex; align-items: center; gap: 14px; }
.av-prev { width: 58px; height: 58px; border-radius: 50%; background: var(--s3); border: 1px solid var(--b2); display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; flex-shrink: 0; }
.av-prev img { width: 100%; height: 100%; object-fit: cover; }
.av-btns { display: flex; flex-direction: column; gap: 7px; }
.av-btn { background: none; border: 1px solid var(--b1); border-radius: 8px; color: var(--tx2); cursor: pointer; padding: 8px 14px; font-size: 13px; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; transition: all 0.12s; }
.av-btn:hover { border-color: var(--b2); color: var(--tx); }

.emoji-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; margin-top: 6px; }
.emoji-btn { background: var(--s2); border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-size: 22px; padding: 6px; text-align: center; transition: all .1s; line-height: 1; }
.emoji-btn:hover { border-color: var(--b2); }
.emoji-btn.sel { border-color: var(--ac2); background: var(--s3); }

.m-foot { padding: 12px 18px 22px; display: flex; gap: 9px; justify-content: flex-end; }
.btn-ok { background: var(--ac2); border: none; border-radius: 9px; color: #0c0c0e; cursor: pointer; padding: 12px 24px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; transition: background .15s; }
.btn-ok:hover { background: var(--ac); }
.btn-cancel { background: none; border: 1px solid var(--b1); border-radius: 9px; color: var(--tx2); cursor: pointer; padding: 12px 18px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; transition: all .15s; }
.btn-cancel:hover { border-color: var(--b2); color: var(--tx); }

/* toast */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--s3); border: 1px solid var(--b2); border-radius: 10px;
  padding: 9px 18px; font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--tx2); letter-spacing: 0.06em; pointer-events: none;
  opacity: 0; transition: all 0.2s; z-index: 500; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }

/* typewriter streaming cursor */
.stream-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--ac2); margin-left: 2px;
  vertical-align: text-bottom; border-radius: 1px;
  animation: blink .7s steps(1) infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

@media (max-width: 899px) {
  .hbtn-label { display: none; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <button class="tb-btn" onclick="openPanel()">☰ Персонажи</button>
  <div class="tb-logo">RoleplayAI</div>
  <button class="tb-btn" id="keyBtn" onclick="openSettings()">⚙ API</button>
  <button class="tb-btn gold" onclick="openCreate()">＋ Новый</button>
</div>

<!-- PANEL OVERLAY -->
<div id="panelOverlay" onclick="closePanel()"></div>

<!-- PANEL -->
<div id="panel">
  <div class="panel-head">
    <span class="panel-title">Персонажи</span>
    <button class="panel-close" onclick="closePanel()">×</button>
  </div>
  <div id="charList"></div>
  <input type="file" id="jsonImportFile" accept=".json" class="hidden" onchange="importCharJSON(event)">
  <button class="panel-add" onclick="document.getElementById('jsonImportFile').click()">↑ Загрузить JSON</button>
  <button class="panel-add" onclick="openCreate(); closePanel()">＋ Новый персонаж</button>
</div>

<!-- MAIN BODY -->
<div id="body">
  <div id="chat">
    <!-- EMPTY -->
    <div id="emptyState">
      <div class="empty-icon">✦</div>
      <div class="empty-t">Выберите персонажа</div>
      <div class="empty-s">или нажмите «＋ Новый» наверху</div>
      <div class="empty-warn hidden" id="noKeyWarn" onclick="openSettings()">⚠ API ключ не указан — нажмите для настройки</div>
    </div>

    <!-- CHAT -->
    <div id="chatWrap">
      <div id="chatHeader">
        <div id="hAvatar"></div>
        <div id="hInfo">
          <div id="hName"></div>
          <div id="hRole"></div>
        </div>
        <div id="hActions">
          <button class="hbtn" onclick="openEdit()">✎ <span class="hbtn-label">Изменить</span></button>
          <button class="hbtn" onclick="exportChat()">↓ <span class="hbtn-label">Экспорт</span></button>
          <button class="hbtn" onclick="exportCharJSON()" title="Экспорт персонажа в JSON">{ }</button>
          <button class="hbtn" onclick="clearChat()">↺ <span class="hbtn-label">Сброс</span></button>
          <button class="hbtn d" onclick="delCurrent()">✕</button>
        </div>
      </div>
      <div id="legend">
        <div class="leg"><div class="leg-dot p"></div>*действие*</div>
        <div class="leg"><div class="leg-dot b"></div>~чувства~</div>
      </div>
      <div id="messages"></div>
      <div id="inputArea">

<!-- TOAST -->
<div id="toast"></div>

<script>
const API_URL = 'https://api.mistral.ai/v1/chat/completions';
const EMOJIS = ['🎭','🐺','🦊','🐉','🧝','🧙','🗡️','🌙','⚔️','🔮','🌹','🦋','🐈','🦁','🐦','🌊','🔥','❄️','🌿','⚡','🌸','🎪','🕯️','👁️','🦅','🐍','🌑','☁️','💀','🏴','🌟','🎶','🧿','🎠','🦄','🌺','🐻','🍄','🦉','🎃','👻','🕷️'];

let chars=[], hists={}, curId=null, editId=null, avData=null, selEmoji=null;
let cfg={ apiKey:'', model:'mistral-large-latest', temp:0.92, maxMem:40 };

function load(){
  try{chars=JSON.parse(localStorage.getItem('rpai_c')||'[]')}catch{chars=[]}
  try{hists=JSON.parse(localStorage.getItem('rpai_h')||'{}')}catch{hists={}}
  try{const s=JSON.parse(localStorage.getItem('rpai_cfg')||'{}');cfg={...cfg,...s};}catch{}
}
function persist(){
  localStorage.setItem('rpai_c',JSON.stringify(chars));
  localStorage.setItem('rpai_h',JSON.stringify(hists));
}
function persistCfg(){
  localStorage.setItem('rpai_cfg',JSON.stringify(cfg));
}

function avHTML(c){ return c.avImg?`<img src="${c.avImg}" alt="">`:c.avEmoji||'🎭'; }
function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const FEEL=/\b(чувств|ощуща|ощутил|ощутила|кажется|казалось|страх|тревог|радост|грусть|грустн|тоск|печал|нежност|любов|боль|обид|злост|стыд|смущен|волнен|восторг|томлен|желан|одинок|скучал|трепет|сердце)/i;
function parse(t){
  return t
    .replace(/~([^~\n]+?)~/g,(_,x)=>`<span class="sf">${e(x)}</span>`)
    .replace(/\*([^*\n]+?)\*/g,(_,x)=>FEEL.test(x)?`<span class="sf">${e(x)}</span>`:`<span class="sa">${e(x)}</span>`)
    .replace(/\n/g,'<br>');
}

/* TOAST */
function toast(msg, dur=2000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),dur);
}

/* PANEL */
function openPanel(){ document.getElementById('panel').classList.add('show'); document.getElementById('panelOverlay').classList.add('show'); }
function closePanel(){ document.getElementById('panel').classList.remove('show'); document.getElementById('panelOverlay').classList.remove('show'); }

/* KEY BUTTON STATE */
function updateKeyBtn(){
  const btn=document.getElementById('keyBtn');
  const warn=document.getElementById('noKeyWarn');
  if(cfg.apiKey){ btn.classList.add('has-key'); btn.textContent='✓ API'; warn.classList.add('hidden'); }
  else { btn.classList.remove('has-key'); btn.textContent='⚙ API'; warn.classList.remove('hidden'); }
}

/* SETTINGS MODAL */
function openSettings(){
  document.getElementById('sApiKey').value=cfg.apiKey||'';
  document.getElementById('sModel').value=cfg.model||'mistral-large-latest';
  document.getElementById('sTemp').value=cfg.temp||0.92;
  document.getElementById('tempLabel').textContent=parseFloat(cfg.temp||0.92).toFixed(2);
  document.getElementById('sMaxMem').value=cfg.maxMem||40;
  updateKeyStatusUI(cfg.apiKey);
  document.getElementById('settingsBg').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsBg').classList.remove('show'); }
function settingsBgClick(ev){ if(ev.target.id==='settingsBg') closeSettings(); }

function updateKeyStatusUI(key){
  const dot=document.getElementById('keyDot');
  const txt=document.getElementById('keyStatusText');
  if(key && key.length>8){
    dot.className='key-dot ok';
    txt.textContent=`Ключ сохранён (${key.substring(0,4)}…${key.slice(-4)})`;
  } else {
    dot.className='key-dot no';
    txt.textContent='Ключ не сохранён';
  }
}

document.getElementById('sApiKey').addEventListener('input', function(){
  updateKeyStatusUI(this.value);
});

function togglePw(){
  const inp=document.getElementById('sApiKey');
  inp.type=inp.type==='password'?'text':'password';
}

function saveSettings(){
  cfg.apiKey=document.getElementById('sApiKey').value.trim();
  cfg.model=document.getElementById('sModel').value;
  cfg.temp=parseFloat(document.getElementById('sTemp').value);
  cfg.maxMem=parseInt(document.getElementById('sMaxMem').value);
  if(isNaN(cfg.maxMem)) cfg.maxMem=0;
  persistCfg();
  closeSettings();
  updateKeyBtn();
  toast('Настройки сохранены ✓');
}

/* RENDER */
function renderList(){
  const el=document.getElementById('charList');
  if(!chars.length){el.innerHTML='<div style="padding:18px 10px;text-align:center;font-size:13px;color:var(--mu)">Нет персонажей</div>';return;}
  el.innerHTML=chars.map(c=>`
    <div class="char-item${c.id===curId?' active':''}" onclick="pick('${c.id}')">
      <div class="char-av">${avHTML(c)}</div>
      <div class="char-info">
        <div class="char-name">${e(c.name)}</div>
        <div class="char-sub">${e(c.role||'Персонаж')}</div>
      </div>
      <button class="char-del" onclick="event.stopPropagation();delChar('${c.id}')">✕</button>
    </div>`).join('');
}

function pick(id){
  curId=id; closePanel(); renderList();
  const c=chars.find(x=>x.id===id); if(!c) return;
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('chatWrap').classList.add('show');
  document.getElementById('hAvatar').innerHTML=avHTML(c);
  document.getElementById('hName').textContent=c.name;
  document.getElementById('hRole').textContent=c.role||'';
  if(!hists[id]){hists[id]=[];if(c.greeting)hists[id].push({role:'assistant',content:c.greeting});}
  renderMsgs(); updateBadge();
}

function renderMsgs(){
  const c=chars.find(x=>x.id===curId); if(!c) return;
  const h=hists[curId]||[];
  const el=document.getElementById('messages');
  el.innerHTML=h.map((m,i)=>m.role==='user'
    ?`<div class="msg u">
        <div class="m-av">👤</div>
        <div class="m-bub">
          <div class="m-name">Вы</div>${e(m.content).replace(/\n/g,'<br>')}
          <div class="msg-actions">
            <button class="msg-act-btn" onclick="copyMsg(${i})" title="Копировать">⎘</button>
            <button class="msg-act-btn" onclick="delMsg(${i})" title="Удалить">✕</button>
          </div>
        </div>
      </div>`
    :`<div class="msg ai">
        <div class="m-av">${avHTML(c)}</div>
        <div class="m-bub">
          <div class="m-name">${e(c.name)}</div>${parse(m.content)}
          <div class="msg-actions">
            <button class="msg-act-btn" onclick="copyMsg(${i})" title="Копировать">⎘</button>
            <button class="msg-act-btn" onclick="delMsg(${i})" title="Удалить">✕</button>
          </div>
        </div>
      </div>`
  ).join('');
  el.scrollTop=el.scrollHeight;
}

function updateBadge(){
  const h=hists[curId]||[];
  if(!h.length){document.getElementById('memBadge').textContent='';return;}
  const lim=cfg.maxMem===0?'∞':cfg.maxMem;
  document.getElementById('memBadge').textContent=`память: ${h.length} / ${lim} сообщ.`;
}

function countChars(){
  const v=document.getElementById('msgIn').value;
  const el=document.getElementById('charCount');
  el.textContent=v.length?`${v.length} симв.`:'';
}

function copyMsg(idx){
  const h=hists[curId]||[];
  if(!h[idx]) return;
  navigator.clipboard.writeText(h[idx].content).then(()=>toast('Скопировано ✓')).catch(()=>toast('Не удалось скопировать'));
}

function delMsg(idx){
  if(!curId) return;
  hists[curId].splice(idx,1);
  persist(); renderMsgs(); updateBadge();
}

function buildSys(c){
  const st={casual:'Говори неформально',formal:'Говори изысканно',poetic:'Пиши поэтично с метафорами',terse:'Будь краток и резок',playful:'Будь игривым с юмором'};
  return `Ты — ${c.name}. Веди себя ИСКЛЮЧИТЕЛЬНО как этот персонаж. НИКОГДА не выходи из роли, не упоминай что ты ИИ.
${c.role?`Роль: ${c.role}\n`:''}${c.personality?`Характер: ${c.personality}\n`:''}${c.appearance?`Внешность: ${c.appearance}\n`:''}${c.scenario?`Предыстория: ${c.scenario}\n`:''}Стиль: ${st[c.style]||st.casual}.
ОБЯЗАТЕЛЬНО: физические действия в *звёздочках*, чувства/эмоции в ~тильдах~, речь обычным текстом. Отвечай на русском, помни весь контекст.`;
}

async function streamAPI(c, messages, onChunk){
  if(!cfg.apiKey) throw new Error('API ключ не указан. Откройте ⚙ Настройки.');
  const r=await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
    body:JSON.stringify({
      model: cfg.model||'mistral-large-latest',
      messages:[{role:'system',content:buildSys(c)},...messages.map(m=>({role:m.role,content:m.content}))],
      max_tokens:700,
      temperature:cfg.temp||0.92,
      stream:true
    })
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t); }
  const reader=r.body.getReader();
  const dec=new TextDecoder();
  let full='';
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    const chunk=dec.decode(value,{stream:true});
    const lines=chunk.split('\n');
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const data=line.slice(5).trim();
      if(data==='[DONE]') break;
      try{
        const j=JSON.parse(data);
        const delta=j.choices?.[0]?.delta?.content||'';
        if(delta){ full+=delta; onChunk(full); }
      }catch{}
    }
  }
  return full;
}

function showTyping(c){
  const msgs=document.getElementById('messages');
  const t=document.createElement('div');
  t.className='msg ai'; t.id='typing';
  t.innerHTML=`<div class="m-av">${avHTML(c)}</div><div class="m-bub"><div class="typing"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`;
  msgs.appendChild(t); msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){ document.getElementById('typing')?.remove(); }
function setBusy(v){ document.getElementById('sendBtn').disabled=v; document.getElementById('regenBtn').disabled=v; }

// Create a streaming AI message bubble and return its content element
function createStreamBub(c){
  hideTyping();
  const msgs=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='msg ai'; wrap.id='streamMsg';
  wrap.innerHTML=`<div class="m-av">${avHTML(c)}</div><div class="m-bub" id="streamBub"><div class="m-name">${e(c.name)}</div><span id="streamText"></span><span class="stream-cursor" id="streamCursor"></span></div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
  return document.getElementById('streamText');
}
function finalizeStream(c, full, idx){
  const wrap=document.getElementById('streamMsg');
  if(!wrap) return;
  const cursor=document.getElementById('streamCursor');
  if(cursor) cursor.remove();
  const bub=document.getElementById('streamBub');
  if(bub){
    bub.innerHTML=`<div class="m-name">${e(c.name)}</div>${parse(full)}<div class="msg-actions"><button class="msg-act-btn" onclick="copyMsg(${idx})" title="Копировать">⎘</button><button class="msg-act-btn" onclick="delMsg(${idx})" title="Удалить">✕</button></div>`;
  }
  wrap.id='';
}

async function send(){
  const inp=document.getElementById('msgIn');
  const txt=inp.value.trim(); if(!txt||!curId) return;
  const c=chars.find(x=>x.id===curId); if(!c) return;
  inp.value=''; inp.style.height=''; countChars();
  if(!hists[curId]) hists[curId]=[];
  hists[curId].push({role:'user',content:txt});
  renderMsgs(); setBusy(true); showTyping(c);
  try{
    const h=hists[curId];
    const tr=(cfg.maxMem===0||!cfg.maxMem)?h:(h.length>cfg.maxMem?h.slice(h.length-cfg.maxMem):h);
    const textEl=createStreamBub(c);
    const msgs=document.getElementById('messages');
    const reply=await streamAPI(c, tr, (partial)=>{
      textEl.innerHTML=e(partial).replace(/\n/g,'<br>');
      msgs.scrollTop=msgs.scrollHeight;
    });
    const newIdx=hists[curId].length;
    hists[curId].push({role:'assistant',content:reply});
    finalizeStream(c, reply, newIdx);
    persist();
  }catch(err){
    hideTyping();
    hists[curId].push({role:'assistant',content:`*ошибка* ~${err.message}~`});
    renderMsgs();
  }
  setBusy(false); updateBadge();
}

async function regen(){
  if(!curId) return;
  const c=chars.find(x=>x.id===curId); if(!c) return;
  const h=hists[curId]||[];
  if(h.length && h[h.length-1].role==='assistant') hists[curId].pop();
  renderMsgs(); setBusy(true); showTyping(c);
  try{
    const tr=(cfg.maxMem===0||!cfg.maxMem)?hists[curId]:(hists[curId].length>cfg.maxMem?hists[curId].slice(hists[curId].length-cfg.maxMem):hists[curId]);
    const textEl=createStreamBub(c);
    const msgs=document.getElementById('messages');
    const reply=await streamAPI(c, tr, (partial)=>{
      textEl.innerHTML=e(partial).replace(/\n/g,'<br>');
      msgs.scrollTop=msgs.scrollHeight;
    });
    const newIdx=hists[curId].length;
    hists[curId].push({role:'assistant',content:reply});
    finalizeStream(c, reply, newIdx);
    persist();
  }catch(err){
    hideTyping();
    hists[curId].push({role:'assistant',content:`*ошибка* ~${err.message}~`});
    renderMsgs();
  }
  setBusy(false); updateBadge();
}

function exportChat(){
  if(!curId) return;
  const c=chars.find(x=>x.id===curId); if(!c) return;
  const h=hists[curId]||[];
  if(!h.length){ toast('История пуста'); return; }
  const lines=[`# RoleplayAI — чат с ${c.name}`,`Роль: ${c.role||'—'}`,`Экспортировано: ${new Date().toLocaleString('ru')}`,'',...h.map(m=>`[${m.role==='user'?'Вы':c.name}]\n${m.content}`)];
  const blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`chat_${c.name}_${Date.now()}.txt`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Чат экспортирован ✓');
}

function onKey(ev){ if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();} }
function grow(el){ el.style.height=''; el.style.height=Math.min(el.scrollHeight,130)+'px'; }

function clearChat(){
  if(!curId||!confirm('Сбросить историю?')) return;
  const c=chars.find(x=>x.id===curId);
  hists[curId]=[]; if(c?.greeting) hists[curId].push({role:'assistant',content:c.greeting});
  persist(); renderMsgs(); updateBadge();
}

function delChar(id){
  if(!confirm('Удалить персонажа?')) return;
  chars=chars.filter(c=>c.id!==id); delete hists[id]; persist();
  if(curId===id){curId=null;document.getElementById('emptyState').classList.remove('hidden');document.getElementById('chatWrap').classList.remove('show');}
  renderList();
}
function delCurrent(){ if(curId) delChar(curId); }

/* MODAL char */
function openCreate(){
  editId=null; avData=null; selEmoji=null;
  clearForm(); document.getElementById('avPrev').innerHTML='🎭';
  document.getElementById('mTitle').textContent='Новый персонаж';
  document.getElementById('emojiGrid').classList.add('hidden');
  document.getElementById('modalBg').classList.add('show');
}
function openEdit(){
  const c=chars.find(x=>x.id===curId); if(!c) return;
  editId=c.id; avData=c.avImg||null; selEmoji=c.avEmoji||null;
  document.getElementById('fName').value=c.name||'';
  document.getElementById('fRole').value=c.role||'';
  document.getElementById('fPersonality').value=c.personality||'';
  document.getElementById('fAppearance').value=c.appearance||'';
  document.getElementById('fScenario').value=c.scenario||'';
  document.getElementById('fStyle').value=c.style||'casual';
  document.getElementById('fGreeting').value=c.greeting||'';
  document.getElementById('avPrev').innerHTML=c.avImg?`<img src="${c.avImg}" alt="">`:(c.avEmoji||'🎭');
  document.getElementById('mTitle').textContent='Изменить персонажа';
  document.getElementById('emojiGrid').classList.add('hidden');
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function bgClick(ev){ if(ev.target.id==='modalBg') closeModal(); }
function clearForm(){
  ['fName','fRole','fPersonality','fAppearance','fScenario','fGreeting'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fStyle').value='casual';
}
function saveChar(){
  const name=document.getElementById('fName').value.trim();
  if(!name){document.getElementById('fName').focus();return;}
  const d={name,role:document.getElementById('fRole').value.trim(),personality:document.getElementById('fPersonality').value.trim(),appearance:document.getElementById('fAppearance').value.trim(),scenario:document.getElementById('fScenario').value.trim(),style:document.getElementById('fStyle').value,greeting:document.getElementById('fGreeting').value.trim(),avImg:avData,avEmoji:avData?null:(selEmoji||'🎭')};
  if(editId){
    const i=chars.findIndex(c=>c.id===editId);
    if(i!==-1){chars[i]={...chars[i],...d};if(curId===editId){const c=chars[i];document.getElementById('hAvatar').innerHTML=avHTML(c);document.getElementById('hName').textContent=c.name;document.getElementById('hRole').textContent=c.role||'';}}
    persist();renderList();closeModal();toast('Персонаж обновлён ✓');
  }else{
    const nc={id:Date.now().toString(),...d};
    chars.push(nc);persist();renderList();closeModal();pick(nc.id);
    toast('Персонаж создан ✓');
  }
}
function onAvFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev2=>{avData=ev2.target.result;selEmoji=null;document.getElementById('avPrev').innerHTML=`<img src="${avData}" alt="">`;};
  r.readAsDataURL(f);
}
function toggleEmoji(){
  const g=document.getElementById('emojiGrid');
  if(g.classList.contains('hidden')){buildEmoji();g.classList.remove('hidden');}
  else g.classList.add('hidden');
}
function buildEmoji(){
  document.getElementById('emojiGrid').innerHTML=EMOJIS.map(em=>`<button class="emoji-btn${em===selEmoji?' sel':''}" onclick="pickEmoji('${em}')">${em}</button>`).join('');
}
function pickEmoji(em){
  selEmoji=em; avData=null;
  document.getElementById('avPrev').innerHTML=em;
  document.getElementById('emojiGrid').classList.add('hidden');
}

/* JSON IMPORT / EXPORT */
function importCharJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  ev.target.value='';
  const r=new FileReader();
  r.onload=e2=>{
    try{
      let data=JSON.parse(e2.target.result);
      // accept single object or array
      const list=Array.isArray(data)?data:[data];
      let added=0;
      for(const raw of list){
        if(!raw.name) continue;
        const nc={
          id: Date.now().toString()+Math.random().toString(36).slice(2),
          name: raw.name||'',
          role: raw.role||raw.description||'',
          personality: raw.personality||raw.char_persona||raw.character||'',
          appearance: raw.appearance||'',
          scenario: raw.scenario||raw.world_scenario||raw.char_greeting||'',
          style: raw.style||'casual',
          greeting: raw.greeting||raw.first_mes||'',
          avImg: raw.avImg||null,
          avEmoji: raw.avEmoji||'🎭'
        };
        chars.push(nc); added++;
      }
      if(added){ persist(); renderList(); toast(`Загружено персонажей: ${added} ✓`); }
      else toast('Не найдено подходящих персонажей');
    }catch(err){ toast('Ошибка разбора JSON: '+err.message); }
  };
  r.readAsText(f);
}

function exportCharJSON(){
  if(!curId) return;
  const c=chars.find(x=>x.id===curId); if(!c) return;
  const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`char_${c.name}_${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Персонаж экспортирован ✓');
}

load(); renderList(); updateKeyBtn();
</script>
